purpose: 名義上是 1688 爬蟲→AI 生圖文→蝦皮批次上架；實際已膨脹成 6 個獨立子系統的集合體
usage: 依子系統各有入口：main.py 命令列 / gui.py 上架 / order_gui.py 訂貨 / reconcile_gui.py 對帳
url:
launch_mac: run_mac.command
launch_win: run_windows.bat
description: |
  掛在「1688→蝦皮」名下、實際已長成 6 個獨立子系統的 Python 桌面工具集（tkinter GUI + main.py CLI，Mac/Windows 雙平台）。原始核心＝爬 1688 單品頁（Playwright+cookie+stealth 或 Chrome MCP 注入 JS 抽 DOM）→ Claude 生蝦皮文案+變體 → 產「過審二階」批次上架 Excel（黃金規則見 CLAUDE.md，錯一條就被擋）。圖片走 1688 原圖或 GPT 生圖/轉繁體版。

  六個子系統：
  1. 爬蟲上架（gui.py 一條龍：更新名單→勾選→抓取→產 Excel→素材夾）。
  2. 每日訂貨（order_gui.py：讀蝦皮匯出→join 訂貨主檔→彙總→驅動 vendored cart_adder 到 1688 加購→核對）。
  3. 金流對帳（reconcile_gui.py + reconcile_daemon 常駐：頁內 lib.mtop 抓 1688 待付款訂單→合併覆蓋核對表 1688_DB，看得出廠商偷改價；LaunchAgent 勾選觸發）。
  4. Kkren（巧巧郎集運）到貨抓取（httpx+Bearer token 抓已出貨包裹運單號→中繼表 Kkren_Data）。
  5. 蝦皮後台分析（scraper/shopee_analytics：每日抓 6 張表→raw+SQLite+Google Sheet，三賣場；再疊 AI 店長顧問/每日戰報/改動追蹤日誌，寫 Supabase 供 dashboard 讀）。
  6. AI 素材生成（product_card 商品資產包 + gpt_image_generator 生圖 + asset_sync 主表勾選一鍵同步到雲端硬碟）。

  共用 Google Sheet 為真相、SQLite 加速、raw JSON 快照；SA inventory-sync 寫入，多賣場一賣場一份 cookie。
stack: [Python, tkinter, Playwright, Claude, Gemini, OpenAI, Supabase]
entrypoint: main.py（另有 gui.py / order_gui.py / reconcile_gui.py 多入口）
