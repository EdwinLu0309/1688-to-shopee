description: |
  掛在「1688→蝦皮」名下的 Python 桌面工具集（tkinter GUI + main.py CLI，Mac/Windows）。曾長成 6 個子系統，2026-08 拆解中——**5/6 已遷出獨立 repo / 共用套件，本 repo 舊碼已移除**：
  - ✅ ⑤ 蝦皮後台分析 → `shopee-analytics` repo
  - ✅ ④ Kkren 到貨 → `kkren-sync` repo（③ daemon 已解焊，subprocess 呼叫它）
  - ✅ ① 1688 抓取 → `ecommerce-sources.alibaba1688`（本 repo scrape 走 playwright_scraper）
  - ✅ ⑥ AI 素材 → `ecommerce-media`（5 模組；本 repo scraper/{gpt_image_generator,auto_classify,image_host,video_maker,size_chart_maker}.py 為 re-export shim）
  - ✅ 讀 Google 表格 → `ecommerce-sources.gsheet`（master_reader 改用）

  現存本 repo：
  - **① 爬蟲上架核心**（gui.py 一條龍：更新名單→勾選→抓取→產「過審二階」蝦皮 Excel→素材夾；黃金規則見 CLAUDE.md）。
  - **② 每日訂貨**（order_gui.py：讀蝦皮匯出→join 訂貨主檔→彙總→驅動 cart_adder 到 1688 加購→核對）。
  - **③ 金流/到貨對帳**（reconcile_gui.py + reconcile_daemon 常駐：lib.mtop 抓 1688 待付款/到貨→1688_DB，看得出廠商改價；LaunchAgent 勾選觸發）。

  ⚠️ ②③ 是下一個拆解目標，計畫整包合進 `1688-order` repo（見 sessions #S132）。
stack: [Python, tkinter, Playwright, Claude, Gemini, OpenAI, Supabase]
