name: 1688-to-shopee
title: 1688→蝦皮 上架系統
layer: 營運工具
status: 可用
purpose: 1688 商品爬取 → AI 生圖文 → 蝦皮「過審二階」批次上架 Excel + 商品資產包（純上架；六子系統拆解已收官）
usage: gui.py 一條龍上架 GUI；main.py CLI（scrape/generate/batch2/product-cards/sync-assets）
url:
launch_mac: run_mac.command
launch_win: run_windows.bat
description: |
  掛在「1688→蝦皮」名下的**上架系統**（tkinter GUI + main.py CLI，Mac/Windows）。曾長成 6 個子系統，2026-08 拆解**收官（6/6）**，本 repo 收斂為純上架：
  - ✅ ⑤ 蝦皮後台分析 → `shopee-analytics` repo
  - ✅ ④ Kkren 到貨 → `kkren-sync` repo
  - ✅ ① 1688 抓取 → `ecommerce-sources.alibaba1688`（scrape 走 playwright_scraper）
  - ✅ ⑥ AI 素材 → `ecommerce-media`（本 repo scraper/{gpt_image_generator,auto_classify,image_host,video_maker,size_chart_maker}.py 為 re-export shim）
  - ✅ 讀 Google 表格 → `ecommerce-sources.gsheet`（master_reader 改用）
  - ✅ **②③ 訂貨/對帳 → 併入 `1688-order`（#S134，本 repo 舊碼已刪 -4723 行）**

  現存本 repo（純上架）：
  - **爬蟲上架核心**（gui.py 一條龍：更新名單→勾選→抓取→產「過審二階」蝦皮 Excel→素材夾；黃金規則見 CLAUDE.md）。
  - **商品資產包**（product-cards / sync-assets：每商品整理成廠商固定事實商品卡 + 圖/影片/raw，寫雲端）。

  ⚠️ 訂貨/對帳（②③）已不在此 repo，改到 1688-order。上架 vs 訂貨是兩件事（#S134）。
stack: [Python, tkinter, Playwright, Claude, Gemini, OpenAI, Supabase]
entrypoint: main.py（另有 gui.py 上架 GUI）
repo: EdwinLu0309/1688-to-shopee
writes_to:
  - excel:蝦皮批次上架 Excel（過審二階）
  - google-drive:商品資產包（{賣場}/商品資產/{編號}/）
  - supabase:圖床（GPT 生圖路線）
depends_on:
  - ecommerce-sources（alibaba1688 抓取 + gsheet 讀表）
  - ecommerce-media（5 媒體模組 shim）
  - Supabase / Claude / Gemini / OpenAI API
next:
